  .btn-gold { background: var(--gold); color: #13251d; }

  .btn-ghost { background: transparent; border-color: var(--line); color: var(--text); }
  .btn-ghost:hover:not(:disabled) { border-color: rgba(217,164,65,.5); }
  .btn-ok { background: var(--ok); color: #0d2016; }
  .btn-danger { background: transparent; border-color: rgba(229,103,90,.5); color: #f3a59c; }
  .btn-block { width: 100%; }
  .btn-sm { padding: 6px 12px; min-height: 34px; font-size: .82rem; }
  .link { background: none; border: 0; color: var(--gold); padding: 0; font-size: .88rem; text-decoration: underline; text-underline-offset: 3px; }
  .msg { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; font-size: .88rem; }
  .msg.err { background: var(--danger-soft); color: #f6b5ad; }
  .msg.ok { background: var(--ok-soft); color: #a6e3c0; }
  .auth-foot { display: flex; justify-content: space-between; margin-top: 16px; gap: 12px; flex-wrap: wrap; }

  /* ---------- Application ---------- */

  .topbar-in { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .topbar h1 { font-size: 1.15rem; margin: 0; line-height: 1.2; }
  .who { font-size: .78rem; color: var(--muted); }
  .spacer { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--muted); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .live.on .dot { background: var(--ok); box-shadow: 0 0 0 0 rgba(95,191,138,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(95,191,138,0); } 100% { box-shadow: 0 0 0 0 rgba(95,191,138,0); } }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: transparent; display: inline-grid; place-items: center; flex-shrink: 0; }
  .icon-btn.active { border-color: var(--gold); color: var(--gold); }
  .icon-btn svg { width: 18px; height: 18px; }
  .tabs { max-width: 1100px; margin: 0 auto; padding: 0 12px 10px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { white-space: nowrap; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: .88rem; display: inline-flex; gap: 8px; align-items: center; }
  .tab[aria-selected="true"] { background: var(--gold); color: #13251d; border-color: var(--gold); }
  .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--danger); color: #fff; font-size: .72rem; display: inline-grid; place-items: center; }
  .tab[aria-selected="true"] .badge { background: #13251d; color: var(--gold); }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }
  .banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--gold-soft); border: 1px solid rgba(217,164,65,.4); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-size: .88rem; }
  .banner .spacer { min-width: 8px; }
  .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 6px 0 12px; }
  .section-title h2 { margin: 0; font-size: 1.35rem; }
  .section-title small { color: var(--muted); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); }
  .card { background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }

  .card h3 { margin: 0; font-size: 1.05rem; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: .86rem; }
  .meta b { color: var(--text); font-weight: 600; }
  .note { background: rgba(246,240,228,.05); border-radius: 10px; padding: 8px 10px; font-size: .88rem; white-space: pre-wrap; word-break: break-word; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }

  .pill.confirmed, .pill.contacted { color: var(--gold); }
  .pill.completed { color: var(--ok); }

  .row { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: .88rem; color: var(--muted); }

  .stat .l { color: var(--muted); font-size: .8rem; }

    .form-row { grid-template-columns: 1fr; }
    .who, #liveText, .topbar-in > img { display: none; }

    .topbar h1 { font-size: 1.05rem; white-space: nowrap; }
    .icon-btn { width: 36px; height: 36px; }
    .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat { padding: 10px 12px; } .stat .n { font-size: 1.35rem; }
    main { padding: 14px 12px 60px; }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .loading { text-align: center; color: var(--muted); padding: 60px 0; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  const ago = (ts) => { const m = minutesSince(ts); if (m < 1) return t("justNow"); const txt = m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}`; return t("ago", { t: txt }); };
  const phoneDigits = (p) => String(p || "").replace(/[^\d+]/g, "");

  const ICON = {
    bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
    mute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/></svg>',
  };

  // ------------------------------------------------------------------ État
  const S = {
    session: null, me: null, tab: "calls", resFilter: "today",

  // ------------------------------------------------------------------ Accès aux données
  const sb = DEMO ? null : supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

  const Demo = (() => {

    const rid = "demo";

        { id: "r3", restaurant_id: rid, customer_name: "Client démo C", customer_phone: "600000003", customer_email: null, party_size: 6, reservation_date: addDays(today, 1), reservation_time: "21:00:00", note: "Anniversaire", status: "pending", created_at: new Date(now - 30 * min).toISOString() },
        { id: "r4", restaurant_id: rid, customer_name: "Client démo D", customer_phone: "600000004", customer_email: null, party_size: 3, reservation_date: addDays(today, -1), reservation_time: "20:30:00", note: null, status: "completed", created_at: new Date(now - 2000 * min).toISOString() },

    return { db, rid };

  const API = {
    async load(kind) {
      if (DEMO) return structuredClone(Demo.db[kind]);
      const rid = S.me.restaurant_id;
      if (kind === "calls") {
        const since = new Date(Date.now() - 12 * 3600e3).toISOString();
        const { data, error } = await sb.from("service_calls").select("*").eq("restaurant_id", rid).gte("created_at", since).order("created_at", { ascending: true });
        if (error) throw error; return data;
      }
      if (kind === "reservations") {
        const { data, error } = await sb.from("reservations").select("*").eq("restaurant_id", rid).gte("reservation_date", addDays(todayStr(), -14))
          .order("reservation_date", { ascending: true }).order("reservation_time", { ascending: true });
        if (error) throw error; return data;
      }
      if (kind === "events") {
        const { data, error } = await sb.from("event_requests").select("*").eq("restaurant_id", rid).order("created_at", { ascending: false }).limit(200);
        if (error) throw error; return data;
      }
      if (kind === "staff") {
        const { data, error } = await sb.from("staff").select("*").eq("restaurant_id", rid).order("created_at");
        if (error) throw error; return data;
      }
    },
    async update(kind, id, patch) {
      if (DEMO) { Object.assign(Demo.db[kind].find((x) => x.id === id), patch); return; }
      const table = { calls: "service_calls", reservations: "reservations", events: "event_requests" }[kind];
      const { error } = await sb.from(table).update(patch).eq("id", id);
      if (error) throw error;
    },
    async addStaff(email, role, name) {
      if (DEMO) { Demo.db.staff.push({ user_id: "u" + Date.now(), restaurant_id: Demo.rid, role, display_name: name, email }); return "ok"; }
      const { data, error } = await sb.rpc("add_staff_member", { p_restaurant: S.me.restaurant_id, p_email: email, p_role: role, p_name: name });
      if (error) throw error; return data;
    },
    async removeStaff(userId) {
      if (DEMO) { Demo.db.staff = Demo.db.staff.filter((s) => s.user_id !== userId); return; }
      const { error } = await sb.from("staff").delete().eq("user_id", userId);
      if (error) throw error;
    },
  };

  // ------------------------------------------------------------------ Alertes (son, vibration, notification)
  let audioCtx = null;
  function unlockAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      S.audioReady = true;
    } catch {}
  }
  function chime(times = 2) {
    if (!S.sound || !audioCtx) return;
    const start = audioCtx.currentTime;
    for (let r = 0; r < times; r++) {
      [880, 1175].forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "sine"; o.frequency.value = f;
        const at = start + r * 0.9 + i * 0.18;
        g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.35, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.6);
        o.connect(g).connect(audioCtx.destination); o.start(at); o.stop(at + 0.65);
      });
    }
  }
  function alertUser(text, urgent) {
    toast(text);
    chime(urgent ? 3 : 1);
    if (navigator.vibrate) navigator.vibrate(urgent ? [300, 150, 300, 150, 300] : 200);
    if ("Notification" in window && Notification.permission === "granted" && document.visibilityState !== "visible") {
      try { new Notification("Jardines Berria", { body: text, icon: "/favicon.svg", tag: text, renotify: true }); } catch {}
    }
  }
  let toastTimer;
  function toast(text) {
    const el = $("#toast"); el.textContent = text; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 5000);
  }
  async function enableAlerts() {
    unlockAudio(); chime(1);
    if ("Notification" in window && Notification.permission === "default") { try { await Notification.requestPermission(); } catch {} }
    render();
  }

  // Écran toujours allumé (tablette au comptoir)
  let wakeLock = null;
  async function keepAwake() { try { if ("wakeLock" in navigator && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); } catch {} }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.me) { keepAwake(); refreshAll(); } });

  // ------------------------------------------------------------------ Chargement + détection des nouveautés
  async function refresh(kind) {
    if (kind === "events" && S.me.role !== "manager") return;
    if (kind === "staff" && S.me.role !== "manager") return;
    try {
      const rows = await API.load(kind);
      S[kind] = rows;
      if (kind !== "staff") detectNew(kind, rows);
      if (S.live === "offline") S.live = DEMO ? "live" : (channel?.state === "joined" ? "live" : "polling");
    } catch (e) {
      console.error(kind, e);
      if (!navigator.onLine) S.live = "offline";
    }
  }
  function detectNew(kind, rows) {
    const seen = S.seen[kind];
    const fresh = rows.filter((r) => !seen.has(r.id));
    rows.forEach((r) => seen.add(r.id));
    if (!S.primed) return;
    for (const r of fresh) {
      if (kind === "calls" && r.status === "pending") alertUser(t("newCall", { t: r.table_number }), true);
      if (kind === "reservations" && r.status === "pending") alertUser(t("newRes", { name: r.customer_name, n: r.party_size }), false);
      if (kind === "events" && r.status === "new") alertUser(t("newEvent", { name: r.customer_name }), false);
    }
  }
  let refreshing = null;
  async function refreshAll() {
    if (!S.me) return;
    if (refreshing) return refreshing;
    refreshing = Promise.all(["calls", "reservations", "events", "staff"].map(refresh)).then(() => { S.primed = true; render(); updateTitle(); }).finally(() => { refreshing = null; });
    return refreshing;
  }

  // Temps réel Supabase (avec actualisation automatique en secours)
  let channel = null;
  function subscribe() {
    if (DEMO) { S.live = "live"; return; }
    const rid = S.me.restaurant_id;
    const tables = { service_calls: "calls", reservations: "reservations" };
    if (S.me.role === "manager") tables.event_requests = "events";
    channel = sb.channel("staff-" + rid);
    for (const [table, kind] of Object.entries(tables)) {
      channel.on("postgres_changes", { event: "*", schema: "public", table, filter: `restaurant_id=eq.${rid}` }, () => refresh(kind).then(() => { render(); updateTitle(); }));
    }
    channel.subscribe((status) => { S.live = status === "SUBSCRIBED" ? "live" : "polling"; renderLive(); });
  }
  setInterval(() => { if (S.me) refreshAll(); }, POLL_MS);
  setInterval(() => { if (S.me && S.tab === "calls") render(); }, 30000); // minutes écoulées
  window.addEventListener("offline", () => { S.live = "offline"; renderLive(); });
  window.addEventListener("online", () => refreshAll());

  function updateTitle() {
    const n = S.calls.filter((c) => c.status === "pending").length;

  }

  // ------------------------------------------------------------------ Rendu
  function render() {
    if (!S.me) return;
    document.documentElement.lang = lang;
    $("#who").textContent = `${S.me.display_name || S.session?.user?.email || ""} · ${t(S.me.role)}`;
    $("#langBtn").textContent = t("lang"); $("#langBtn").title = t("langName");
    $("#soundBtn").innerHTML = S.sound ? ICON.bell : ICON.mute;
    $("#soundBtn").classList.toggle("active", S.sound);
    $("#soundBtn").title = S.sound ? t("soundOn") : t("soundOff");
    $("#logout").title = t("logout");
    renderLive();

    const pendingCalls = S.calls.filter((c) => c.status === "pending").length;
    const pendingRes = S.reservations.filter((r) => r.status === "pending").length;
    const newEvents = S.events.filter((e) => e.status === "new").length;
    const tabs = [["calls", t("tabCalls"), pendingCalls], ["reservations", t("tabRes"), pendingRes]];
    if (S.me.role === "manager") tabs.push(["events", t("tabEvents"), newEvents], ["team", t("tabTeam"), 0]);
    $("#tabs").innerHTML = tabs.map(([k, label, n]) =>
      `<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${esc(label)}${n ? `<span class="badge">${n}</span>` : ""}</button>`).join("");

    let html = "";

    const needsAlerts = !S.audioReady || ("Notification" in window && Notification.permission === "default");
    if (needsAlerts && S.sound) html += `<div class="banner"><span>🔔 ${esc(t("enableAlerts"))}</span><span class="spacer"></span><button class="btn btn-gold btn-sm" data-action="enable-alerts">${esc(t("enable"))}</button></div>`;
    if (S.me.role === "manager" && (S.tab === "calls" || S.tab === "reservations")) html += renderStats();
    html += { calls: renderCalls, reservations: renderReservations, events: renderEvents, team: renderTeam }[S.tab]();
    $("#main").innerHTML = html;
  }
  function renderLive() {
    const el = $("#live"); if (!el) return;
    el.classList.toggle("on", S.live === "live");
    $("#liveText").textContent = t(S.live === "live" ? "live" : S.live === "offline" ? "offline" : "polling");

  function renderStats() {
    const today = todayStr();
    const todays = S.reservations.filter((r) => r.reservation_date === today && r.status !== "cancelled");
    const stats = [
      [S.calls.filter((c) => c.status === "pending").length, t("statPending")],
      [todays.length, t("statToday")],
      [todays.reduce((a, r) => a + (r.party_size || 0), 0), t("statGuests")],

    return `<div class="stats">${stats.map(([n, l]) => `<div class="stat"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`).join("")}</div>`;

  function renderCalls() {
    const pending = S.calls.filter((c) => c.status === "pending");
    const handled = S.calls.filter((c) => c.status === "handled" && Date.now() - new Date(c.handled_at || c.created_at) < 3 * 3600e3)

    let h = `<div class="section-title"><h2 class="serif">${esc(t("callsTitle"))}</h2><small>${pending.length}</small></div>`;

        <div class="card-head">
          <div><div class="table-label">${esc(t("table"))}</div><div class="table-num">${esc(c.table_number)}</div></div>
          <div style="text-align:right"><div class="elapsed ${m >= 6 ? "danger" : m >= 3 ? "warn" : ""}">${esc(ago(c.created_at))}</div><div class="meta">${esc(fmtTime(c.created_at))}</div></div>

  function contactButtons(phone) {
    if (!phone) return "";
    const wa = waLink(phone);
    return `<a class="btn btn-ghost btn-sm" href="tel:${esc(phoneDigits(phone))}">📞 ${esc(t("call"))}</a>${wa ? `<a class="btn btn-ghost btn-sm" href="${esc(wa)}" target="_blank" rel="noopener">💬 ${esc(t("whatsapp"))}</a>` : ""}`;
  }
  function renderReservations() {
    const today = todayStr(), mgr = S.me.role === "manager";
    const filters = [["today", t("fToday")], ["upcoming", t("fUpcoming")], ["pending", t("fPending")], ["past", t("fPast")]];
    let list = S.reservations;
    if (S.resFilter === "today") list = list.filter((r) => r.reservation_date === today);

    if (S.resFilter === "pending") list = list.filter((r) => r.status === "pending" && r.reservation_date >= today);

    let h = `<div class="section-title"><h2 class="serif">${esc(t("resTitle"))}</h2></div>

          <label class="field" style="margin:0"><span>${esc(t("email"))}</span><input class="input" name="email" type="email" required /></label>
          <label class="field" style="margin:0"><span>${esc(t("name"))}</span><input class="input" name="name" maxlength="60" /></label>
          <label class="field" style="margin:0"><span>${esc(t("role"))}</span><select class="input" name="role"><option value="server">${esc(t("server"))}</option><option value="manager">${esc(t("manager"))}</option></select></label>
          <button class="btn btn-gold" type="submit">${esc(t("add"))}</button>
        </div>
      </form>
      <div class="card" style="padding:4px 4px">${S.staff.map((m) => `<div class="row">
        <b>${esc(m.display_name || m.email || "—")}</b><span>${esc(m.email || "")}</span><span class="spacer"></span>
        <span class="pill ${m.role === "manager" ? "confirmed" : "completed"}">${esc(t(m.role))}</span>
        ${m.user_id === myId ? `<span>(${esc(t("you"))})</span>` : `<button class="btn btn-danger btn-sm" data-action="remove-staff" data-id="${esc(m.user_id)}" data-name="${esc(m.display_name || m.email || "")}">${esc(t("remove"))}</button>`}
      </div>`).join("")}</div>`;
  }

  // ------------------------------------------------------------------ Actions
  document.addEventListener("pointerdown", unlockAudio, { once: true });
  document.addEventListener("click", async (ev) => {
    const tabBtn = ev.target.closest("[data-tab]");
    if (tabBtn) { S.tab = tabBtn.dataset.tab; render(); window.scrollTo(0, 0); return; }
    const a = ev.target.closest("[data-action]"); if (!a) return;
    const id = a.dataset.id;
    try {
      if (a.dataset.action === "enable-alerts") return enableAlerts();
      if (a.dataset.action === "res-filter") { S.resFilter = a.dataset.f; return render(); }
      a.disabled = true;
      if (a.dataset.action === "handle-call") {
        await API.update("calls", id, { status: "handled", handled_at: new Date().toISOString(), handled_by: S.me.display_name || S.session?.user?.email || null });
        await refresh("calls");
      }
      if (a.dataset.action === "res-status") { await API.update("reservations", id, { status: a.dataset.s }); await refresh("reservations"); }
      if (a.dataset.action === "ev-status") { await API.update("events", id, { status: a.dataset.s }); await refresh("events"); }
      if (a.dataset.action === "remove-staff") {
        if (!confirm(t("confirmRemove", { name: a.dataset.name }))) { a.disabled = false; return; }
        await API.removeStaff(id); await refresh("staff");
      }
      render(); updateTitle();
    } catch (e) { console.error(e); toast(t("error")); a.disabled = false; }
  });
  document.addEventListener("submit", async (ev) => {
    if (ev.target.id !== "addStaff") return;
    ev.preventDefault();
    const f = new FormData(ev.target), btn = ev.target.querySelector("button[type=submit]");
    btn.disabled = true;
    try {
      const res = await API.addStaff(String(f.get("email")).trim(), f.get("role"), String(f.get("name") || "").trim());
      toast(res === "ok" ? t("added") : t("notFound"));
      if (res === "ok") { await refresh("staff"); render(); }
    } catch (e) { console.error(e); toast(t("error")); }
    btn.disabled = false;
  });
  $("#soundBtn").addEventListener("click", () => {
    S.sound = !S.sound; try { localStorage.setItem("staff-sound", S.sound ? "on" : "off"); } catch {}
    if (S.sound) { unlockAudio(); chime(1); }
    render();
  });
  const switchLang = () => { lang = lang === "fr" ? "es" : "fr"; try { localStorage.setItem("staff-lang", lang); } catch {} applyStatic(); render(); };
  $("#langBtn").addEventListener("click", switchLang);
  $("#langBtnAuth").addEventListener("click", switchLang);
  const doLogout = async () => { if (!DEMO) await sb.auth.signOut(); location.reload(); };
  $("#logout").addEventListener("click", doLogout);
  $("#logout2").addEventListener("click", doLogout);

  // ------------------------------------------------------------------ Connexion
  let mode = "login";
  function applyStatic() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    $("#authSubmit").textContent = t(mode === "login" ? "login" : "signup");
    $("#toggleMode").textContent = t(mode === "login" ? "toSignup" : "toLogin");
    $("#langBtnAuth").textContent = t("langName");
    $("#password").autocomplete = mode === "login" ? "current-password" : "new-password";
  }
  function authMsg(text, kind) { const el = $("#authMsg"); el.textContent = text; el.className = "msg " + kind; }
  $("#toggleMode").addEventListener("click", () => { mode = mode === "login" ? "signup" : "login"; $("#authMsg").className = "msg hidden"; applyStatic(); });
  $("#forgot").addEventListener("click", async () => {
    const email = $("#email").value.trim();
    if (!email) return authMsg(t("needEmail"), "err");
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + "/staff/" });
    authMsg(error ? t("error") : t("resetSent"), error ? "err" : "ok");
  });
  $("#authForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const email = $("#email").value.trim(), password = $("#password").value;
    if (!email || password.length < 6) return authMsg(t("badLogin"), "err");
    const btn = $("#authSubmit"); btn.disabled = true;
    unlockAudio();
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) authMsg(t("badLogin"), "err");
      } else {
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + "/staff/" } });
        if (error) authMsg(error.message, "err");
        else if (!data.session) authMsg(t("signupDone"), "ok");
      }
    } finally { btn.disabled = false; }
  });

  function show(id) { ["auth", "noaccess", "app"].forEach((s) => $("#" + s).classList.toggle("hidden", s !== id)); }

  async function onSession(session) {
    S.session = session;
    if (!session) { S.me = null; show("auth"); return; }
    const { data, error } = await sb.from("staff").select("*").eq("user_id", session.user.id).maybeSingle();
    if (error || !data) {
      $("#noAccessText").textContent = t("noAccessText", { email: session.user.email });
      show("noaccess"); return;
    }
    if (S.me && S.me.user_id === data.user_id) return; // déjà lancé (rafraîchissement du jeton)
    S.me = data;
    startApp();
  }
  function startApp() {
    show("app");
    if (S.me.role !== "manager" && (S.tab === "events" || S.tab === "team")) S.tab = "calls";
    render(); subscribe(); refreshAll(); keepAwake();
  }

  // ------------------------------------------------------------------ Démarrage
  applyStatic();
  if (DEMO) {
    S.session = { user: { id: "u1", email: "gerant@example.com" } };
    S.me = { user_id: "u1", restaurant_id: Demo.rid, role: new URLSearchParams(location.search).get("demo") === "server" ? "server" : "manager", display_name: "Démo" };
    startApp();
  } else {
    sb.auth.getSession().then(({ data }) => onSession(data.session));
    // setTimeout : ne jamais appeler Supabase directement dans ce rappel (blocage connu de supabase-js)
    sb.auth.onAuthStateChange((_e, session) => { if (!session || !S.me) setTimeout(() => onSession(session), 0); });
  }
})();
</script>
</body>
</html>
